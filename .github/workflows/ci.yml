name: checks
on:
    push:
    pull_request:
permissions:
    contents: read
jobs:
    tests:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                node: [22, 24]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm ci --ignore-scripts
            - run: npm run check
            - run: npm run format:check
            - run: npm test
            - name: Check PowerShell syntax
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $errors = $null
                  $tokens = $null
                  [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'share.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
                  if ($errors.Count) { $errors; exit 1 }
    browser:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci --ignore-scripts
            - run: npx playwright install --with-deps chromium
            - run: npm run test:browser
